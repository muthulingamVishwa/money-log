name: Keep Supabase awake

# Supabase pauses free projects after 7 days without activity.
# This runs a tiny database query every 3 days so Money Log stays online.
# It reads the project URL and publishable key from index.html (both are public by design).

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days, 03:17 UTC (08:47 IST)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the database
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' index.html | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' index.html | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase URL or key not found in index.html"; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Pinged $URL"
